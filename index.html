<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="form-container">
    <h1>Validation Form</h1>
    <p class="intro">Please complete all required fields.</p>

    <form id="validation-form" novalidate>
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full-name" placeholder="Enter your full name">
        <small class="error-message" id="full-name-error"></small>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com">
        <small class="error-message" id="email-error"></small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters">
        <small class="error-message" id="password-error"></small>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password">
        <small class="error-message" id="confirm-password-error"></small>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="At least 10 digits">
        <small class="error-message" id="phone-error"></small>
      </div>

      <fieldset class="form-group option-group" id="gender-group">
        <legend>Gender</legend>
        <div class="options">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="prefer-not-to-say"> Prefer not to say</label>
        </div>
        <small class="error-message" id="gender-error"></small>
      </fieldset>

      <fieldset class="form-group option-group" id="hobbies-group">
        <legend>Hobbies / Interests</legend>
        <div class="options">
          <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
          <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
          <label><input type="checkbox" name="hobbies" value="music"> Music</label>
          <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
        </div>
        <small class="error-message" id="hobbies-error"></small>
      </fieldset>

      <div class="form-group">
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select your country</option>
          <option value="indonesia">Indonesia</option>
          <option value="malaysia">Malaysia</option>
          <option value="singapore">Singapore</option>
          <option value="australia">Australia</option>
          <option value="other">Other</option>
        </select>
        <small class="error-message" id="country-error"></small>
      </div>

      <button type="submit">Submit</button>
      <p id="success-message" role="status"></p>
    </form>
  </main>
</body>
</html>
